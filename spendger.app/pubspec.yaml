name: spendger
description: "Spendger - Offline-First Personal Finance Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Reactivity
  flutter_riverpod: ^2.5.1

  # Local Persistence (Drift SQLite)
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI, Icons, Fonts & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  gap: ^3.0.1

  # Security & Device Utilities
  local_auth: ^2.2.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  csv: ^6.0.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/spendger.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/spendger.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
